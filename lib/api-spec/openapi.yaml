        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAccountBlocksInput" } } }
      responses:
        "200": { description: Account block list saved, content: { application/json: { schema: { $ref: "#/components/schemas/CloseFriendsResponse" } } } }
        "400": { description: Invalid or unknown account IDs }
  /close-friends:
    get:
      operationId: listCloseFriends
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: The signed-in account's private Close Friends list, content: { application/json: { schema: { $ref: "#/components/schemas/CloseFriendsResponse" } } } }
    put:
      operationId: replaceCloseFriends
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCloseFriendsInput" } } }
      responses:
        "200": { description: Close Friends list saved, content: { application/json: { schema: { $ref: "#/components/schemas/CloseFriendsResponse" } } } }
        "400": { description: Invalid or unknown account IDs }
  /chats:
    get:
      operationId: listChats
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Conversations for the signed-in user, content: { application/json: { schema: { $ref: "#/components/schemas/ChatRoomsResponse" } } } }
    post:
      operationId: createChat
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatRoomInput" } } }
      responses:
        "201": { description: Conversation created or already present, content: { application/json: { schema: { $ref: "#/components/schemas/ChatRoomResponse" } } } }
        "400": { description: Invalid members or blocked account }
        "409": { description: Conversation ID belongs to another account }
  /chats/legacy-archives:
    get:
      operationId: listLegacyChatArchives
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Private archives of conversations previously stored on this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyChatArchivesResponse"
        "401": { description: Sign-in required }
  /chats/legacy-archives/{sourceId}/{part}:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
      - { name: part, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 99 } }
    put:
      operationId: saveLegacyChatArchivePart
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyChatArchivePartInput"
      responses:
        "200":
          description: Archive part already exists with the same verified content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyChatArchivePartResponse"
        "201":
          description: Archive part saved privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyChatArchivePartResponse"
        "400": { description: Invalid or oversized archive part }
        "401": { description: Sign-in required }
        "409": { description: Archive part conflicts with a different stored copy }
  /chats/legacy-archives/{sourceId}:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
    delete:
      operationId: deleteLegacyChatArchive
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: The signed-in owner's private archive was deleted }
        "401": { description: Sign-in required }
        "404": { description: Archive not found }
  /chats/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
    get:
      operationId: listChatMessages
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Recent messages for a conversation member, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessagesResponse" } } } }
        "404": { description: Conversation not found or not a member }
    post:
      operationId: createChatMessage
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessageInput" } } }
      responses:
        "201": { description: Text message persisted and acknowledged, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessageResponse" } } } }
        "400": { description: Invalid or unsupported message body }
        "404": { description: Conversation not found or not a member }
  /chats/{id}/messages/{messageId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
      - { name: messageId, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
    patch:
      operationId: editChatMessage
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessageEditInput" } } }
      responses:
        "200": { description: Message edited, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessageResponse" } } } }
        "400": { description: Invalid edit }
        "404": { description: Message not found or not owned by the signed-in user }
    delete:
      operationId: deleteChatMessage
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: The signed-in author's message was removed from the conversation }
        "404": { description: Message not found or not owned by the signed-in user }
  /chats/{id}/state:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
    put:
      operationId: updateChatMemberState
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatMemberStateInput" } } }
      responses:
        "200": { description: The signed-in member's conversation state was saved, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMemberStateResponse" } } } }
        "400": { description: Invalid conversation state }
        "404": { description: Conversation not found }
  /chats/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
    post:
      operationId: markChatRead
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChatReadReceiptInput" } } }
      responses:
        "204": { description: Read state saved for the signed-in member }
        "404": { description: Conversation not found }
  /creative/drafts/{context}:
    parameters:
      - { name: context, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9:_-]+$" } }
    get:
      operationId: getCreativeDraft
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner's cloud draft, if present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreativeDraftResponse" }
    put:
      operationId: putCreativeDraft
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreativeDraft" } } }
      responses:
        "200": { description: Draft saved to the signed-in account }
        "400": { description: Invalid draft or unconfirmed media }
    delete:
      operationId: deleteCreativeDraft
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Owner’s draft removed }
  /media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPrivateMedia
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner-only private media
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { description: Media does not exist or is not owned by the viewer }
    delete:
      operationId: deletePrivateMedia
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Owner-only media removed from private storage }
        "404": { description: Media does not exist or is not owned by the viewer }
  /media/{id}/upload:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reservePrivateMediaUpload
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivateMediaUploadInput" } } }
      responses:
        "200": { description: Existing upload reservation or already confirmed media }
        "201": { description: Resumable upload reservation created }
        "400": { description: Unsupported media metadata }
        "409": { description: Media ID conflicts with an existing upload }
        "503": { description: Supabase could not create the signed upload session }
  /media/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmPrivateMediaUpload
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivateMediaUploadConfirm" } } }
      responses:
        "200": { description: Supabase Storage verified the upload }
        "404": { description: Upload reservation not found }
        "409": { description: The uploaded object does not match the reservation }
        "503": { description: Supabase has not confirmed the upload yet }
  /media/{id}/url:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPrivateMediaUrl
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Short-lived signed URL for authorized media }
        "404": { description: Media does not exist or is not visible to the viewer }
  /blast/state/{scope}:
    parameters:
      - { name: scope, in: path, required: true, schema: { type: string, enum: [social, video-notes] } }
    get:
      operationId: getBlastAccountState
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner-only cloud state for Blast
          content: { application/json: { schema: { $ref: "#/components/schemas/BlastStateResponse" } } }
        "400": { description: Invalid state scope }
    put:
      operationId: putBlastAccountState
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BlastStateInput" } } }
      responses:
        "200":
          description: Blast state saved with the next revision
          content: { application/json: { schema: { $ref: "#/components/schemas/BlastStateSaved" } } }
        "400": { description: Invalid state or attachment }
        "409": { description: State changed in another session }
        "413": { description: State exceeds the storage limit }
    delete:
      operationId: deletePrivateMedia
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Owner-only media removed from private storage }
        "404": { description: Media does not exist or is not owned by the viewer }
  /stories:
    get:
      operationId: listStories
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Active stories visible to the signed-in account, content: { application/json: { schema: { $ref: "#/components/schemas/StoriesResponse" } } } }
    post:
      operationId: createStory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateStoryInput" } } }
      responses:
        "201": { description: Story metadata saved, content: { application/json: { schema: { $ref: "#/components/schemas/StoryResponse" } } } }
        "400": { description: Invalid story }
  /stories/import:
    post:
      operationId: importLegacyStory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryImportInput" } } }
      responses:
        "200": { description: Legacy Story stored or matched idempotently, content: { application/json: { schema: { $ref: "#/components/schemas/StoryImportResponse" } } } }
        "400": { description: Invalid legacy Story }
        "409": { description: Existing Story conflicts with the submitted source record }
  /stories/{id}/media:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadStoryMedia
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Private story media uploaded }
        "400": { description: Invalid media or story }
    get:
      operationId: readStoryMedia
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Private media for an active story visible to the signed-in account, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { description: Story not found or not visible }
  /stories/{id}/media-url:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStoryMediaUrl
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Short-lived signed link for media on a visible Story }
        "404": { description: Story not found or not visible }
        "503": { description: Story media could not be loaded }
  /stories/{id}/views:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordStoryView
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: View recorded once for this account, content: { application/json: { schema: { $ref: "#/components/schemas/StoryViewResponse" } } } }
        "404": { description: Story not found or not visible }
  /stories/{id}/reactions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: upsertStoryReaction
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryReactionInput" } } }
      responses:
        "200": { description: Reaction saved, content: { application/json: { schema: { $ref: "#/components/schemas/StoryReactionResponse" } } } }
        "409": { description: The signed-in account cannot react to its own Story }
        "404": { description: Story not found or not visible }
    delete:
      operationId: deleteStoryReaction
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Current user's reaction removed }
        "404": { description: Story not found or not visible }
  /stories/{id}/activity:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStoryActivity
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Story views and reactions visible only to the Story owner, content: { application/json: { schema: { $ref: "#/components/schemas/StoryActivityResponse" } } } }
        "404": { description: Story not owned by the signed-in account }
  /stories/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listStoryComments
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Replies for a Story visible to the signed-in account, content: { application/json: { schema: { $ref: "#/components/schemas/StoryCommentsResponse" } } } }
        "404": { description: Story not found or not visible }
    post:
      operationId: createStoryComment
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoryCommentInput" } } }
      responses:
        "201": { description: Reply sent, content: { application/json: { schema: { $ref: "#/components/schemas/StoryCommentResponse" } } } }
        "400": { description: Invalid reply or replies disabled }
        "409": { description: Reply is disabled or the Story has expired }
        "404": { description: Story not found or not visible }
  /stories/{id}/comments/{commentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteStoryComment
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Reply deleted by its author or Story owner }
        "404": { description: Reply not found or not authorized }
  /stories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateStory
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStoryInput" } } }
      responses:
        "200": { description: Story settings updated, content: { application/json: { schema: { $ref: "#/components/schemas/StoryResponse" } } } }
        "404": { description: Story not owned by the signed-in account }
    delete:
      operationId: deleteStory
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Story and its private media deleted }
        "404": { description: Story not owned by the signed-in account }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    AccountPostResponse:
      type: object
      required: [post]
      properties:
        post:
          $ref: "#/components/schemas/SocialPost"
    NotificationReadInput:
      type: object
      required: [through]
      properties:
        through: { type: number, minimum: 0 }
    AccountNotification:
      type: object
      required: [id, kind, body, actor, postId, storyId, commentId, createdAt, read]
      properties:
        id: { type: string }
        kind: { type: string }
        body: { type: string }
        actor:
          type: object
          required: [id, username, displayName, avatar]
          properties:
            id: { type: string }
            username: { type: string }
            displayName: { type: string }
            avatar: { type: ["string", "null"] }
        postId: { type: ["string", "null"] }
        storyId: { type: ["string", "null"] }
        commentId: { type: ["string", "null"] }
        createdAt: { type: number }
        read: { type: boolean }
    NotificationFeed:
      type: object
      required: [notifications, readAt, nextBefore]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AccountNotification"
        readAt: { type: number }
        nextBefore: { type: ["number", "null"] }
    LegacyRelationshipImportInput:
      type: object
      properties:
        followingIds: { type: array, maxItems: 2000, items: { type: string, format: uuid } }
        friendIds: { type: array, maxItems: 2000, items: { type: string, format: uuid } }
        outgoingFriendRequestIds: { type: array, maxItems: 2000, items: { type: string, format: uuid } }
        outgoingFollowRequestIds: { type: array, maxItems: 2000, items: { type: string, format: uuid } }
    ChatPerson:
      type: object
      required: [id, username, displayName]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        lastReadAt: { type: integer, nullable: true }
    ChatRoom:
      type: object
      required: [id, title, members, createdAt, state]
      properties:
        id: { type: string }
        title: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/ChatPerson" } }
        createdAt: { type: integer }
        state: { $ref: "#/components/schemas/ChatMemberState" }
    ChatRoomInput:
      type: object
      additionalProperties: false
      required: [id, members]
      properties:
        id: { type: string, minLength: 3, maxLength: 80, pattern: "^cv[a-zA-Z0-9-]+$" }
        title: { type: string, maxLength: 80 }
        members: { type: array, minItems: 2, maxItems: 16, uniqueItems: true, items: { type: string, format: uuid } }
    ChatRoomResponse:
      type: object
      required: [chat]
      properties:
        chat: { $ref: "#/components/schemas/ChatRoom" }
    ChatRoomsResponse:
      type: object
      required: [chats]
      properties:
        chats: { type: array, items: { $ref: "#/components/schemas/ChatRoom" } }
    LegacyChatArchivePart:
      type: object
      required: [sourceId, part, totalParts, contentHash, payload, createdAt]
      properties:
        sourceId: { type: string }
        part: { type: integer }
        totalParts: { type: integer }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: integer, format: int64 }
    LegacyChatArchivesResponse:
      type: object
      required: [archives]
      properties:
        archives: { type: array, items: { $ref: "#/components/schemas/LegacyChatArchivePart" } }
    LegacyChatArchivePartInput:
      type: object
      additionalProperties: false
      required: [totalParts, contentHash, payload]
      properties:
        totalParts: { type: integer, minimum: 1, maximum: 100 }
        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        payload: { type: object, additionalProperties: true }
    LegacyChatArchivePartResponse:
      type: object
      required: [status, archive]
      properties:
        status: { type: string, enum: [imported, already-imported] }
        archive: { $ref: "#/components/schemas/LegacyChatArchivePart" }
    ChatMessage:
      type: object
      required: [id, conversationId, author, kind, body, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        author: { $ref: "#/components/schemas/ChatPerson" }
        kind: { type: string, enum: [text, photo, video, gif, voice, file, sticker, poll, location, contact, call, shared-post, system] }
        body: { type: string }
        createdAt: { type: integer }
        metadata: { type: object, additionalProperties: true }
        media: { type: array, items: { $ref: "#/components/schemas/ChatMessageMedia" } }
        readBy: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [sent, read] }
        reactions: { type: object, additionalProperties: { type: array, items: { type: string, format: uuid } } }
        poll:
          type: object
          required: [question, options, votes]
          properties:
            question: { type: string }
            options: { type: array, items: { type: string } }
            votes: { type: object, additionalProperties: { type: array, items: { type: string, format: uuid } } }
        edited: { type: boolean }
        editedAt: { type: integer }
        editHistory: { type: array, items: { type: string } }
    ChatMessageMedia:
      type: object
      required: [reference, contentType, size]
      properties:
        reference: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 0 }
    ChatMessageInput:
      type: object
      additionalProperties: false
      required: [clientId, kind, body]
      properties:
        clientId: { type: string, minLength: 3, maxLength: 80 }
        kind: { type: string, enum: [text, photo, video, gif, voice, file, sticker, poll, location, contact, call, shared-post] }
        body: { type: string, maxLength: 5000 }
        metadata: { type: object, additionalProperties: true }
        mediaIds: { type: array, maxItems: 4, uniqueItems: true, items: { type: string, format: uuid } }
    ChatMessageEditInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    ChatMemberState:
      type: object
      properties:
        draft: { type: string, maxLength: 5000 }
        pinnedIds: { type: array, maxItems: 3, items: { type: string, maxLength: 80 } }
        savedMessageIds: { type: array, maxItems: 1000, items: { type: string, maxLength: 80 } }
        hiddenMessageIds: { type: array, maxItems: 2000, items: { type: string, maxLength: 80 } }
        keptMessageIds: { type: array, maxItems: 1000, items: { type: string, maxLength: 80 } }
        disappear: { type: string, enum: [off, 10 seconds, 24 hours, after view] }
        mutedUntil: { type: integer, minimum: 0 }
        wallpaper: { type: string, enum: ["", "#e7f6e9"] }
        locked: { type: boolean }
        shareReceipts: { type: boolean }
        reactions: { type: object, additionalProperties: { type: array, maxItems: 7, items: { type: string, maxLength: 16 } } }
        pollVotes: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 9 } }
    ChatMemberStateInput:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/ChatMemberState" }
    ChatMemberStateResponse:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/ChatMemberState" }
    ChatReadReceiptInput:
      type: object
      additionalProperties: false
      properties:
        shareReceipts: { type: boolean, default: true }
    ChatMessageResponse:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/ChatMessage" }
    ChatMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
    TournamentJoin:
      type: object
