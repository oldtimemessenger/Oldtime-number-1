openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and sessions
  - name: social
    description: Cloud-backed profiles, posts, and likes
paths:
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      parameters:
        - name: before
          in: query
          schema: { type: number, minimum: 1 }
      responses:
        "200":
          description: Authenticated account activity, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationFeed"
  /notifications/read:
    post:
      operationId: readNotifications
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Read cursor saved to the account
          content:
            application/json:
              schema:
                type: object
                required: [readAt]
                properties:
                  readAt: { type: number }
  /tournaments:
    get:
      operationId: listTournaments
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all, mine] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000 } }
      responses:
        "200":
          description: Accessible tournaments, with authoritative server standings
          content:
            application/json:
              schema:
                type: object
                required: [tournaments, hasMore, serverNow]
                properties:
                  tournaments: { type: array, items: { $ref: "#/components/schemas/Tournament" } }
                  hasMore: { type: boolean }
                  serverNow: { type: string, format: date-time }
        "401": { description: Sign-in required }
    post:
      operationId: createTournament
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentInput" }
      responses:
        "201":
          description: Created competition; featuring another person remains private pending their consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tournament" }
        "400": { description: Invalid tournament settings }
        "401": { description: Sign-in required }
  /tournaments/people:
    get:
      operationId: searchTournamentPeople
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
      responses:
        "200":
          description: Available registered users, excluding blocked accounts
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/TournamentPerson" } }
  /tournaments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTournament
      security: [{ BearerAuth: [] }]
      responses:
        "200": &tournamentResult
          description: Current tournament; completion standings are immutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tournament" }
        "404": { description: Tournament not found or not accessible }
  /tournaments/{id}/join:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: joinTournament
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentJoin" }
      responses:
        "200": *tournamentResult
        "403": { description: Invitation or consent required }
        "409": { description: Competition ended or participation already declined }
  /tournaments/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: declineTournamentInvitation
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentEmptyAction" }
      responses:
        "200": *tournamentResult
        "409": { description: No pending invitation or competition ended }
  /tournaments/{id}/invitations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: inviteTournamentParticipant
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentInvitation" }
      responses:
        "200": *tournamentResult
        "403": { description: Organizer permission required }
        "409": { description: Duplicate invitation or competition ended }
  /tournaments/{id}/support:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: supportTournamentParticipant
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentSupport" }
      responses:
        "200": *tournamentResult
        "409": { description: "Duplicate or self support, or outside official competition window" }
  /tournaments/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelTournament
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentEmptyAction" }
      responses:
        "200": *tournamentResult
        "403": { description: Organizer permission required }
        "409": { description: Only upcoming competitions can be cancelled }
  /boards/{id}/entries/{entryId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateParticipationEntry
      summary: Edit an author's entry or moderate a board entry
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipationEntryUpdate"
      responses:
        "200":
          description: Updated entry, with access-controlled author and moderation fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipationEntryResult"
        "400": { description: Invalid edit }
        "401": { description: Sign-in required }
        "404": { description: Entry unavailable or edit not permitted }
    delete:
      operationId: deleteParticipationEntry
      summary: Delete the signed-in author's own board entry
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Entry deleted }
        "401": { description: Sign-in required }
        "404": { description: Entry unavailable or not owned by the signed-in user }
  /boards:
    get:
      operationId: listParticipationBoards
      summary: List boards visible to the signed-in user
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, popular] } }
      responses:
        "200":
          description: Public, owned, and invited boards visible to the signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationBoardListResult" }
        "401": { description: Sign-in required }
    post:
      operationId: createParticipationBoard
      summary: Create a Get On Board prompt with explicit visibility settings
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParticipationBoardInput" }
      responses:
        "201":
          description: Created board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationBoard" }
        "400": { description: Invalid board settings }
        "401": { description: Sign-in required }
  /boards/{id}:
    get:
      operationId: getParticipationBoard
      summary: Get a board and its accessible entries
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Board and visible entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationBoardDetailResult" }
        "401": { description: Sign-in required }
        "404": { description: Board not found or not accessible }
    delete:
      operationId: deleteParticipationBoard
      summary: Delete the signed-in creator's board and its media
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Board and attached entries deleted }
        "401": { description: Sign-in required }
        "404": { description: Board not found or not owned by the signed-in user }
  /boards/{id}/entries:
    post:
      operationId: createParticipationEntry
      summary: Respond to a board with text
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParticipationEntryInput" }
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationEntryResult" }
        "200":
          description: Existing entry returned after an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationEntryResult" }
        "400": { description: Invalid entry or unsupported response type }
        "401": { description: Sign-in required }
        "409": { description: Board unavailable or duplicate entry belongs to another user }
  /boards/{id}/entries/media/{entryId}/{mediaType}:
    post:
      operationId: uploadParticipationEntryMedia
      summary: Upload a photo or video response to a board
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: mediaType, in: path, required: true, schema: { type: string, enum: [photo, video] } }
        - { name: X-Upload-Mime, in: header, required: true, schema: { type: string, enum: [image/jpeg, video/mp4, video/webm] } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created media response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationEntryResult" }
        "200":
          description: Existing entry returned after an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipationEntryResult" }
        "400": { description: Invalid or unsupported media }
        "401": { description: Sign-in required }
        "409": { description: Board unavailable or duplicate entry belongs to another user }
  /places/search:
    get:
      operationId: searchPlaces
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Explicit place search using OpenStreetMap data, never automatic device tagging
          content:
            application/json:
              schema:
                type: object
                required: [places, attribution]
                properties:
                  places: { type: array, items: { $ref: "#/components/schemas/PlaceTag" } }
                  attribution:
                    type: object
                    required: [text, url]
                    properties:
                      text: { type: string }
                      url: { type: string }
        "503":
          description: Search unavailable; manual place tagging remains available
  /sports/workouts:
    get:
      operationId: listSportsWorkouts
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        "200":
          description: Owner-only private workout history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [workouts]
                properties:
                  workouts: { type: array, items: { $ref: "#/components/schemas/SportsWorkout" } }
                  nextOffset: { type: [integer, "null"] }
  /sports/workouts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveSportsWorkout
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SportsRecording" }
      responses:
        "200":
          description: Idempotently saved; statistics computed on server, not supplied by client
          content:
            application/json:
              schema:
                type: object
                required: [workout]
                properties:
                  workout: { $ref: "#/components/schemas/SportsWorkout" }
        "409": { description: ID already belongs to a different recording }
    get:
      operationId: getSportsWorkout
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Owner-only route and summary
          content:
            application/json:
              schema:
                type: object
                required: [workout]
                properties:
                  workout: { $ref: "#/components/schemas/SportsWorkout" }
        "404": { description: Workout absent or not owned by viewer }
    delete:
      operationId: deleteSportsWorkout
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: "Private recording, exported cards and associated public sports post removed" }
  /sports/workouts/{id}/card:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadSportsCard
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Owner-only exported image, not publicly accessible until explicitly published
          content:
            application/json:
              schema:
                type: object
                required: [cardId]
                properties:
                  cardId: { type: string, format: uuid }
  /posts/{id}/sports-card:
    get:
      operationId: getPublishedSportsCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Explicitly published card image with JPEG metadata removed; no private raw route exposed
          content:
            image/jpeg: { schema: { type: string, format: binary } }
  /auth/cognito/config:
    get:
      operationId: getCognitoConfiguration
      tags: [auth]
      summary: Get public hosted sign-in configuration
      responses:
        "200":
          description: Public configuration; never includes a client secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CognitoConfiguration"
        "503":
          description: Sign-in configuration is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/cognito/exchange:
    post:
      operationId: exchangeCognitoSession
      tags: [auth]
      summary: Verify a PKCE sign-in and optionally link an authenticated existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CognitoExchangeInput"
      responses:
        "200":
          description: Verified account session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid sign-in request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Identity does not match the account being linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Existing account must be linked explicitly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Sign-in provider is unavailable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a cloud account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many registration attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in to a cloud account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid sign-in details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email, username, or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many sign-in attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getMyAccount
      tags: [auth]
      summary: Get the signed-in account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccountResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: End this device's session
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password:
    post:
      operationId: changeAccountPassword
      tags: [auth]
      summary: Change the signed-in account password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: Invalid password change request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required or current password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feed:
    get:
      operationId: listFeed
      tags: [social]
      summary: Read recent cloud posts
      security:
        - BearerAuth: []
      parameters:
        - name: surface
          in: query
          schema:
            type: string
            enum: [main, community, following, community-following]
            default: main
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Recent posts and like state for the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts:
    post:
      operationId: createPost
      tags: [social]
      summary: Publish a text post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
      responses:
        "201":
          description: Post saved to the cloud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostCreationResult"
        "400":
          description: Invalid post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/import:
    post:
      operationId: importLegacyPosts
      tags: [social]
      summary: Idempotently import supported posts and their confirmed media from this device
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostImportInput"
      responses:
        "200":
          description: Per-post import confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostImportResponse"
        "400":
          description: Invalid import batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{id}/like:
    put:
      operationId: likePost
      tags: [social]
      summary: Like a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Post liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unlikePost
      tags: [social]
      summary: Remove a like from a post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Post unliked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /posts/{id}/repost:
    put:
      operationId: repostPost
      tags: [social]
      summary: Repost a visible post or update the note on your repost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRepostInput"
      responses:
        "200":
          description: Repost saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostRepostResponse"
        "400":
